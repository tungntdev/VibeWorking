[package]
name = "ai-office"
version = "1.0.0"
description = "Văn phòng AI 3D - quản lý đội ngũ nhân viên AI"
edition = "2021"
default-run = "ai-office"

[lib]
name = "ai_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
shell-words = "1"
anyhow = "1"
once_cell = "1"
tauri-plugin-dialog = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
docx-rs = "0.4.22"
rust_xlsxwriter = "0.102.0"
genpdf = "0.2.0"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"
zip = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
